<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ICMD – AICTE Complaint Monitoring Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f6fa;--cd:#fff;--tx:#1f2937;--mu:#64748b;--bd:#dde6ee;--pri:#1f4e79;--pr2:#0b6bc1;--ok:#1e7b4f;--wn:#e8752a;--bad:#c0392b;--sf:#eef4fa;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--cd:#18222e;--tx:#e5e7eb;--mu:#94a3b8;--bd:#2a3846;--pri:#7fb2e5;--pr2:#4aa3f0;--ok:#4cc38a;--wn:#f29a5c;--bad:#ef7b6d;--sf:#1d2936;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1720;--cd:#18222e;--tx:#e5e7eb;--mu:#94a3b8;--bd:#2a3846;--pri:#7fb2e5;--pr2:#4aa3f0;--ok:#4cc38a;--wn:#f29a5c;--bad:#ef7b6d;--sf:#1d2936;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cd);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:15px;margin:0;color:var(--pri);flex:1;line-height:1.2}header small{display:block;color:var(--mu);font-weight:400;font-size:11px}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{background:var(--pr2);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600}.btn.g{background:var(--sf);color:var(--pri);border:1px solid var(--bd)}.btn.s{padding:5px 9px;font-size:12px}.btn.o{background:var(--wn)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--cd);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:8px 2px;font-size:11px;color:var(--mu);cursor:pointer;position:relative}nav button b{display:block;font-size:17px}nav button.on{color:var(--pr2);font-weight:700}
.dot{position:absolute;top:3px;right:18%;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
main{padding:12px 12px 80px;max-width:1200px;margin:auto}
.grid{display:grid;gap:10px}.k{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px}.card h3{margin:0 0 8px;font-size:14px;color:var(--pri)}
.kpi{cursor:pointer;border-left:4px solid var(--pr2)}.kpi b{display:block;font-size:24px}.kpi span{color:var(--mu);font-size:12px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}.bar i{display:block;height:10px;border-radius:5px;background:var(--pr2)}.bar div{flex:1;background:var(--sf);border-radius:5px}.bar em{width:90px;font-style:normal}
.chip{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600;background:var(--sf);color:var(--pri)}
.Pending{background:#fdecc8;color:#8a5a00}.Under{background:#dbeafe;color:#1e40af}.Disposed{background:#d6f1e3;color:#166534}.Transferred{background:#ede9fe;color:#5b21b6}.Escalated{background:#fde2e0;color:#991b1b}.Overdue{background:var(--bad);color:#fff}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.f input,.f select,.fm input,.fm select,.fm textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--cd)}.f .w{grid-column:1/-1}
.case{cursor:pointer;margin-bottom:8px}.case:hover{border-color:var(--pr2)}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.mu{color:var(--mu);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-size:12px}
.ov{border:1px solid var(--wn);background:color-mix(in srgb,var(--wn) 10%,var(--cd));border-radius:12px;padding:12px;margin-bottom:10px}.ov strong{color:var(--wn)}
.al{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--bd);cursor:pointer}.al b{font-size:18px}
.mod{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:12px}.tl div{margin-bottom:10px;position:relative}.tl div::before{content:"";position:absolute;left:-18px;top:4px;width:10px;height:10px;border-radius:5px;background:var(--pr2)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs .btn{white-space:nowrap}.wrap{overflow-x:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:#111827;color:#fff;padding:9px 14px;border-radius:10px;z-index:60;display:none;max-width:90%}
.sug{padding:7px;border:1px solid var(--bd);border-radius:8px;margin-top:4px;cursor:pointer;background:var(--cd)}
@media(min-width:900px){nav{top:0;bottom:auto;right:auto;width:150px;flex-direction:column;padding-top:60px;border-top:0;border-right:1px solid var(--bd)}nav button{padding:12px;text-align:left;font-size:13px}nav button b{display:inline;margin-right:8px}.dot{right:10px;top:12px}main{margin-left:160px;padding-bottom:30px;max-width:none}header{padding-left:164px}.k{grid-template-columns:repeat(6,1fr)}.two{grid-template-columns:1fr 1fr}.f{grid-template-columns:repeat(4,1fr)}.f .w{grid-column:span 2}.mod{align-items:center}.sheet{max-width:640px;border-radius:16px}}
.lgp{position:fixed;inset:0;z-index:50;background:var(--cd);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.lgl{padding:20px 20px 14px;background:linear-gradient(160deg,color-mix(in srgb,var(--pr2) 16%,var(--bg)),color-mix(in srgb,var(--ok) 12%,var(--bg)));flex-shrink:0}
.lbr{display:flex;align-items:center;gap:12px}.lgo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--pr2),var(--ok));display:grid;place-items:center;flex:none}.lbr h2{margin:0;font-size:26px}.lsub{color:var(--mu);margin:6px 0 10px 58px;font-size:14px}
.hl,.sihc{display:none}.lgr{padding:20px;flex:1;display:flex;flex-direction:column;justify-content:flex-start;overflow-y:auto}.lin{max-width:560px;width:100%;margin:0 auto}
.lin h2{margin:0 0 4px;font-size:26px;font-weight:800;color:var(--pri);display:block}
.lc{display:flex;align-items:center;gap:14px;padding:13px;border:1px solid var(--bd);border-radius:14px;background:var(--cd);margin-top:12px;cursor:pointer}.lc:hover{border-color:var(--ok)}.lc small{display:block;color:var(--mu)}.lt{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}.ar{margin-left:auto;color:var(--mu);display:flex}
.dv{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px;margin:18px 0 4px}.dv::before,.dv::after{content:"";flex:1;height:1px;background:var(--bd)}
.lin label{display:block;font-weight:600;margin:12px 0 6px}.lin input{width:100%;padding:13px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);font-size:15px}.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--mu);padding:6px;display:flex}
.lin .go{width:100%;margin-top:18px;padding:13px;background:var(--ok);display:flex;justify-content:center;align-items:center;gap:8px;font-size:15px}
@media(min-width:900px){.lgp{flex-direction:row;overflow:hidden}.lgl{width:40%;max-width:480px;padding:44px 40px;display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}.lsub{margin-bottom:0}.hl{display:block;margin-top:60px}.hl h3{font-size:20px;margin:0 0 12px}.hl ul{padding:0;margin:0}.hl li{display:flex;gap:12px;margin:12px 0;font-size:15px;list-style:none}.hl li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:7px}.sihc{display:block;margin-top:auto;border:1px solid var(--bd);border-radius:14px;padding:14px;background:color-mix(in srgb,var(--cd) 70%,transparent);color:var(--mu);font-size:12px}.lgr{width:60%;display:flex;flex-direction:column;justify-content:flex-start;overflow-y:auto;padding:36px 40px}.lin{margin:auto auto}}
</style></head><body>
<header><span class="lgo" style="width:34px;height:34px;border-radius:9px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="8.8" cy="12" r="5.6" fill="#fff" fill-opacity=".22"/><circle cx="15.2" cy="12" r="5.6" fill="#fff" fill-opacity=".22"/><path d="M12 8.9v6.2" stroke-linecap="round"/></svg></span><h1>ICMD <small>Integrated Institution Complaint Monitoring · AICTE (Database Connected)</small></h1><span id="us" class="mu" style="text-align:right;font-size:11px;line-height:1.25"></span><button class="btn g s" data-a="theme">◐</button><button class="btn" data-a="new" style="display:none">+ New</button><button class="btn g s" data-a="out" style="display:none">Logout</button></header>
<nav id="nav"></nav><main id="app"></main><div id="toast"></div><div id="md"></div>
<script>
// --- ICMD Full-Stack Client - Fully Wired to FastAPI Backend & Database ---
const D=864e5,NOW=new Date();NOW.setHours(12,0,0,0);const $=s=>document.querySelector(s);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=t=>new Date(t).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
const BU=["RB","PGRC","Approval Bureau","Quality Cell"],CATS=["Fee irregularity","Faculty shortage","Infrastructure deficit","Admission malpractice","Approval lapse","Student harassment"],ST=["Pending","Under Process","Disposed","Transferred","Escalated"],SLA=30;

// --- Seed Data Fallback (Enables instant 1-click GitHub Pages static hosting) ---
const I_SEED=[["1-4602131","Government College of Engineering, Pune","Pune","West"],["1-5521904","Sri Venkateswara Institute of Technology","Tirupati","South"],["1-3310877","Eastern Institute of Management & Technology","Kolkata","East"],["1-2204561","National Polytechnic Institute","Lucknow","North"],["1-6670142","Central India College of Pharmacy","Bhopal","Central"],["1-7781230","Coastal Institute of Engineering","Kochi","South"],["1-1198340","Northern Technical University","Chandigarh","North"],["1-8842019","Sahyadri School of Architecture","Nashik","West"]].map(a=>({id:a[0],name:a[1],city:a[2],region:a[3]}));
const R_SEED=[[0,0,"PGRC","Under Process",18,4,"R. Deshmukh","Fee records requested","Review reply"],[0,0,"RB","Pending",9,9,"S. Iyer","Case registered","Issue show-cause"],[1,1,"RB","Under Process",41,6,"A. Menon","Show-cause issued","Hearing"],[1,2,"Approval Bureau","Pending",12,12,"K. Rao","Inspection planned","Site visit"],[2,3,"PGRC","Escalated",36,3,"P. Sen","Escalated to Dean","Decision"],[2,4,"RB","Under Process",24,5,"M. Das","Document check","Verify affiliation"],[3,5,"PGRC","Under Process",15,2,"N. Verma","Statement taken","Committee review"],[3,1,"Quality Cell","Pending",8,8,"T. Singh","Registered","Assign officer"],[4,0,"RB","Disposed",50,10,"V. Joshi","Warning issued","Closed"],[4,3,"PGRC","Transferred",22,7,"L. Khan","Moved to RB","RB to examine"],[4,3,"RB","Under Process",20,6,"V. Joshi","Received from PGRC","Notice"],[5,2,"Approval Bureau","Pending",33,20,"J. Thomas","Awaiting inspection","Inspection"],[5,0,"PGRC","Under Process",11,3,"D. Nair","Reply sought","Verify"],[6,1,"RB","Disposed",60,15,"H. Kaur","Compliance accepted","Closed"],[6,4,"PGRC","Pending",5,5,"G. Malik","Registered","Assign"],[7,2,"RB","Under Process",27,4,"C. Patil","Inspection report","Order"],[7,5,"PGRC","Pending",3,3,"R. Deshmukh","Registered","Assign"],[2,0,"Quality Cell","Under Process",19,3,"B. Roy","Audit started","Findings"],[1,1,"PGRC","Disposed",45,12,"A. Rao","Resolved","Closed"],[3,2,"RB","Transferred",14,6,"S. Iyer","Sent to Approval Bureau","Approval Bureau action"]];
let I=I_SEED;
let ALL=R_SEED.map((r,i)=>{const rc=NOW-r[4]*D,la=NOW-r[5]*D;return{id:"CMP-2026-"+String(101+i).padStart(4,"0"),inst_id:I[r[0]].id,name:I[r[0]].name,city:I[r[0]].city,region:I[r[0]].region,cat:CATS[r[1]],bu:r[2],st:r[3],rc,la,off:r[6],last:r[7],next:r[8],due:rc+SLA*D,linked:null}});
let C=ALL,OVERLAPS=[],U=null;
// Session restore from browser storage
try { const saved = localStorage.getItem("aicte_icmd_user"); if(saved) U=JSON.parse(saved); } catch(e){}

const ACC=[{e:"rb@aicte.gov.in",n:"A. Menon",r:"RB Officer",k:"rb",bu:"RB"},{e:"pgrc@aicte.gov.in",n:"R. Deshmukh",r:"PGRC Officer",k:"pg",bu:"PGRC"},{e:"approval@aicte.gov.in",n:"K. Rao",r:"Other Bureau/Cell Officer (Approval Bureau)",k:"ab",bu:"Approval Bureau"},{e:"south@aicte.gov.in",n:"J. Thomas",r:"Regional Office – South",k:"ro",rg:"South"},{e:"chairman@aicte.gov.in",n:"Dr. S. Kumar",r:"Senior Management / Competent Authority (view only)",k:"mg"}];

const canAct=c=>U.k==="ad"||(U.k==="ro"&&c.region===U.rg)||(!!U.bu&&c.bu===U.bu);
let S={v:"dash",f:{q:"",bu:"",rg:"",cat:"",st:"",a:"",b:""},rep:"Bureau",sel:null,ai:"all"};
const open=c=>c.st!=="Disposed",age=c=>Math.floor((NOW-c.rc)/D),over=c=>open(c)&&NOW>c.due,soon=c=>open(c)&&!over(c)&&c.due-NOW<=7*D;
const sc=c=>c.st==="Under Process"?"Under":c.st;

function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)}

// --- API Syncing Functions (Real Database Persistence) ---
async function syncFromBackend() {
  try {
    const [instRes, casesRes, ovRes] = await Promise.all([
      fetch('/api/institutions').then(r=>r.json()),
      fetch('/api/cases').then(r=>r.json()),
      fetch('/api/overlaps').then(r=>r.json())
    ]);

    I = instRes.map(x => ({ id: x.aicte_id, name: x.name, city: x.city, region: x.region }));
    
    ALL = casesRes.map(r => ({
      id: r.id,
      inst_id: r.institution_id,
      name: r.institution_name,
      city: r.city,
      region: r.region,
      cat: r.category,
      bu: r.bureau,
      st: r.status,
      rc: r.received_at,
      la: r.last_action_at,
      off: r.officer,
      last: r.last_action,
      next: r.next_action,
      due: r.due_at,
      linked: r.linked_lead
    }));

    OVERLAPS = ovRes;
    C = (U && U.rg) ? ALL.filter(c => c.region === U.rg) : ALL;
    render();
  } catch(err) {
    console.error("Backend sync error:", err);
    render();
  }
}

function overlaps(){
  const o = [];
  I.forEach((n, idx) => {
    const cs = C.filter(c => c.inst_id === n.id && open(c));
    const bs = [...new Set(cs.map(c => c.bu))];
    if(bs.length > 1) {
      const same = CATS.some(k => cs.filter(c => c.cat === k).length > 1);
      o.push({ i: idx, cs, bs, lv: same ? "High" : "Medium", linked: cs.every(c => c.linked) });
    }
  });
  return o;
}

function filt(){
  const f=S.f, q=f.q.toLowerCase();
  return C.filter(c => {
    return (!q || (c.name + c.inst_id + c.id).toLowerCase().includes(q))
      && (!f.bu || c.bu === f.bu)
      && (!f.rg || c.region === f.rg)
      && (!f.cat || c.cat === f.cat)
      && (!f.st || (f.st === "Overdue" ? over(c) : f.st === "Open" ? open(c) : c.st === f.st))
      && (!f.a || c.rc >= new Date(f.a).getTime())
      && (!f.b || c.rc <= new Date(f.b).getTime() + D);
  }).sort((a,b) => b.rc - a.rc);
}

function alerts(){
  const a=[];
  overlaps().forEach(o=>a.push({k:"Overlap",ic:"⚠",t:`Potential Overlapping Cases – ${I[o.i].name}`,s:`Handled by ${o.bs.join(" & ")}. Coordination required.`,go:["ov"]}));
  C.forEach(c=>{
    if(over(c)) a.push({k:"SLA",ic:"⏰",t:`${c.id} is ${age(c)-SLA} days beyond timeline`,s:`${c.name} · ${c.bu}`,go:["c",c.id]});
    else if(soon(c)) a.push({k:"Reminder",ic:"🔔",t:`${c.id} due in ${Math.ceil((c.due-NOW)/D)} days`,s:`${c.name} · ${c.bu}`,go:["c",c.id]});
    if(c.st==="Escalated") a.push({k:"Escalation",ic:"⬆",t:`${c.id} escalated`,s:`${c.name} · ${c.bu}`,go:["c",c.id]});
  });
  return a;
}

const stat=c=>`<span class="chip ${sc(c)}">${c.st}</span>`;
function kp(l,n,f,col){return`<div class="card kpi" data-a="kpi" data-v="${f}" style="border-left-color:${col}"><b>${n}</b><span>${l}</span></div>`}
function bars(rows,max,col){return rows.map(r=>`<div class="bar"><em>${esc(r[0])}</em><div><i style="width:${max?r[1]/max*100:0}%;background:${col||"var(--pr2)"}"></i></div><b>${r[1]}</b></div>`).join("")}

function vDash(){
  const t=C.length,pe=C.filter(c=>c.st==="Pending").length,up=C.filter(c=>c.st==="Under Process").length,di=C.filter(c=>c.st==="Disposed").length,tr=C.filter(c=>c.st==="Transferred").length,ov=C.filter(over).length,ol=overlaps().filter(o=>!o.linked);
  const col=["#e0a020","#0b6bc1","#1e7b4f","#7c3aed","#c0392b"],cn=ST.map(s=>C.filter(c=>c.st===s).length);let a=0;const cg=cn.map((n,i)=>{const s=a;a+=n/t*100;return`${col[i]} ${s}% ${a}%`}).join(",");
  const bw=BU.map(b=>[b,C.filter(c=>c.bu===b&&open(c)).length]),iw=I.map((n)=>[n.name.split(" ").slice(0,2).join(" "),C.filter(c=>c.inst_id===n.id&&open(c)).length]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return`${ol.length?`<div class="ov"><strong>⚠ Potential Overlapping Cases – Coordination Required</strong><div class="mu">${ol.length} institution(s) are being handled by more than one Bureau/Cell in database.</div><button class="btn o s" data-a="go" data-v="ov" style="margin-top:6px">Review overlaps</button></div>`:""}
  <div class="grid k">${kp("Total received",t,"","#1f4e79")+kp("Pending",pe,"Pending","#e0a020")+kp("Under process",up,"Under Process","#0b6bc1")+kp("Disposed",di,"Disposed","#1e7b4f")+kp("Transferred",tr,"Transferred","#7c3aed")+kp("Beyond timeline",ov,"Overdue","#c0392b")}</div>
  <div class="grid two" style="margin-top:10px"><div class="card"><h3>Status distribution</h3><div class="row" style="justify-content:flex-start;gap:16px"><div style="width:110px;height:110px;border-radius:50%;background:conic-gradient(${cg});flex:none;-webkit-mask:radial-gradient(circle 32px,transparent 98%,#000);mask:radial-gradient(circle 32px,transparent 98%,#000)"></div><div>${ST.map((s,i)=>`<div class="mu"><span style="color:${col[i]}">●</span> ${s}: <b>${cn[i]}</b></div>`).join("")}<div class="mu">Disposal rate: <b>${Math.round(di/t*100)}%</b></div></div></div></div>
  <div class="card"><h3>Bureau/Cell workload (open cases)</h3>${bars(bw,Math.max(...bw.map(x=>x[1])))}</div>
  <div class="card"><h3>Institution-wise open cases</h3>${bars(iw,Math.max(...iw.map(x=>x[1])),"var(--wn)")}</div>
  <div class="card"><h3>Latest alerts</h3>${alerts().slice(0,4).map(al=>`<div class="al" data-a="al" data-v="${al.go.join("|")}"><b>${al.ic}</b><div>${esc(al.t)}<div class="mu">${esc(al.s)}</div></div></div>`).join("")}<button class="btn g s" data-a="go" data-v="al" style="margin-top:8px">All alerts</button></div></div>`;
}

function vCases(){
  const f=S.f,L=filt(),o=(a,k)=>a.map(x=>`<option ${f[k]===x?"selected":""}>${x}</option>`).join("");
  return`<div class="f"><input class="w" id="q" placeholder="Search institution, AICTE ID or case ID" value="${esc(f.q)}"><select data-f="bu"><option value="">All Bureaus/Cells</option>${o(BU,"bu")}</select><select data-f="rg"><option value="">All regions</option>${o(["North","South","East","West","Central"],"rg")}</select><select data-f="cat"><option value="">All categories</option>${o(CATS,"cat")}</select><select data-f="st"><option value="">All statuses</option>${o(["Open",...ST,"Overdue"],"st")}</select><input type="date" data-f="a" value="${f.a}" aria-label="From"><input type="date" data-f="b" value="${f.b}" aria-label="To"></div>
  <div class="row mu" style="margin-bottom:8px"><span>${L.length} of ${C.length} cases (Saved in PostgreSQL/SQLite)</span><button class="btn g s" data-a="clr">Clear filters</button></div>

function sim(a,b){

  const A=t(a),B=t(b);if(!A.size||!B.size)return 0;let n=0;
  A.forEach(w=>{if([...B].some(x=>x===w||x.startsWith(w)||w.startsWith(x)))n++});
  return n/Math.max(A.size,1);
}

    const v=t.value.trim(),m=v?I.map((n,k)=>[k,Math.max(sim(v,n.name),n.id.includes(v)?1:0)]).filter(x=>x[1]>=.3).sort((a,b)=>b[1]-a[1]).slice(0,3):[];
    $("#sg").innerHTML=m.map(x=>`<div class="sug" data-a="pk" data-v="${x[0]}">${esc(I[x[0]].name)} <span class="mu">${I[x[0]].id} · match ${Math.round(Math.min(1,x[1])*100)}%</span></div>`).join("");
  }
});

document.addEventListener("change",e=>{const k=e.target.dataset.f;if(k){S.f[k]=e.target.value;render()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="lp"||e.target.id==="le")){const b=document.querySelector("[data-a=lg]");b&&b.click()}});

// Initial boot
syncFromBackend();
</script></body></html>
